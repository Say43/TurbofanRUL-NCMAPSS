[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turbofan-rul"
version = "0.1.0"
description = "RUL-Prognose fuer Turbofan-Triebwerke auf NASA N-CMAPSS (DS02): klassisches ML+UQ vs. Deep Learning+UQ."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frederic Bachmann" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.25,<3",
  "pandas>=2.1,<3",
  "h5py>=3.10,<4",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "ngboost>=0.5,<1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2,<3",
]
dev = [
  "pytest>=8.3,<9",
  "jupyter>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan_rul"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
